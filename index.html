<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg: #FBF8F2;
    --bg-soft: #F5F0E6;
    --card: #FFFFFF;
    --ink: #2B2823;
    --ink-soft: #8C8577;
    --line: #E9E2D4;
    --accent: #B8763E;
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(251,248,242,0.86);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1280px; margin:0 auto;
    padding:20px 28px;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand-mark{
    width:9px; height:9px; border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  .brand h1{
    font-size:17px; font-weight:700; letter-spacing:-0.01em; margin:0;
  }
  .brand .count{
    font-size:12.5px; color:var(--ink-soft); font-weight:500;
  }
  .header-actions{ display:flex; align-items:center; gap:10px; }

  .search{
    position:relative;
  }
  .search input{
    font-family:inherit;
    width:220px;
    padding:9px 14px 9px 32px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--bg-soft);
    font-size:13.5px;
    color:var(--ink);
    outline:none;
    transition:.15s ease;
  }
  .search input:focus{ border-color:var(--accent); background:#fff; width:260px; }
  .search svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; opacity:.5;
  }

  .btn-add{
    font-family:inherit;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:10px 18px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:.15s ease;
  }
  .btn-add:hover{ background:var(--accent); transform:translateY(-1px); }

  /* ---------- Grid ---------- */
  main{
    max-width:1280px; margin:0 auto;
    padding:32px 28px 100px;
  }
  .grid{
    columns: 5 220px;
    column-gap:16px;
  }
  @media (max-width:1100px){ .grid{ columns: 3 200px; } }
  @media (max-width:640px){ .grid{ columns: 2 150px; column-gap:10px; padding:0; } main{padding:20px 14px 80px;} }

  .card{
    break-inside:avoid;
    margin-bottom:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    position:relative;
  }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: 0 14px 28px -12px rgba(43,40,35,0.18);
    border-color:#DED4BE;
  }
  .card img{
    width:100%; display:block;
    background:var(--bg-soft);
  }
  .card .meta{
    padding:11px 13px 13px;
  }
  .card .meta .name{
    font-size:13.5px; font-weight:600; letter-spacing:-0.01em;
    line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card .meta .link-tag{
    margin-top:5px;
    font-size:11px; color:var(--ink-soft);
    display:flex; align-items:center; gap:4px;
  }

  .empty{
    text-align:center;
    padding:120px 20px;
    color:var(--ink-soft);
  }
  .empty .big{ font-size:15px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .empty .small{ font-size:13px; }

  /* ---------- Modal (Add) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(43,40,35,0.35);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .overlay.open{ display:flex; }

  .modal{
    background:#fff;
    border-radius:20px;
    width:100%; max-width:420px;
    padding:26px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.3);
    max-height:88vh;
    overflow-y:auto;
  }
  .modal h2{
    font-size:16px; font-weight:700; margin:0 0 18px;
  }

  .drop{
    border:1.5px dashed var(--line);
    border-radius:14px;
    padding:22px;
    text-align:center;
    cursor:pointer;
    transition:.15s ease;
    position:relative;
    background:var(--bg-soft);
    margin-bottom:16px;
  }
  .drop.drag{ border-color:var(--accent); background:#F6ECE0; }
  .drop input[type=file]{ display:none; }
  .drop .drop-text{ font-size:13px; color:var(--ink-soft); }
  .drop .drop-text b{ color:var(--ink); }

  .preview-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:16px;
  }
  .preview-item{
    position:relative;
    aspect-ratio:1;
    border-radius:10px;
    overflow:hidden;
    background:var(--bg-soft);
    border:1px solid var(--line);
  }
  .preview-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-item .status{
    position:absolute; inset:0;
    background:rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .preview-item .status svg{ width:18px; height:18px; }
  .preview-item .remove{
    position:absolute; top:4px; right:4px;
    width:18px; height:18px; border-radius:50%;
    background:rgba(0,0,0,0.55); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; cursor:pointer; border:none;
    line-height:1;
  }
  .spin{ animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  label.field-label{
    display:block; font-size:12px; font-weight:600; color:var(--ink-soft);
    margin-bottom:6px; margin-top:14px;
  }
  .field-label:first-of-type{ margin-top:0; }
  input.field, textarea.field{
    font-family:inherit;
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
    background:#fff;
    transition:.15s ease;
  }
  input.field:focus{ border-color:var(--accent); }

  .modal-actions{
    display:flex; gap:8px; margin-top:22px;
  }
  .btn-cancel, .btn-save{
    font-family:inherit;
    flex:1;
    padding:11px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    border:none;
  }
  .btn-cancel{ background:var(--bg-soft); color:var(--ink); }
  .btn-cancel:hover{ background:var(--line); }
  .btn-save{ background:var(--ink); color:#fff; }
  .btn-save:hover{ background:var(--accent); }
  .btn-save:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- Lightbox (Detail) ---------- */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(20,18,15,0.82);
    display:none;
    align-items:center; justify-content:center;
    z-index:200;
    padding:30px;
  }
  .lightbox.open{ display:flex; }
  .lb-inner{
    background:#fff;
    border-radius:18px;
    max-width:900px; width:100%;
    max-height:90vh;
    display:flex;
    overflow:hidden;
  }
  @media (max-width:760px){ .lb-inner{ flex-direction:column; overflow-y:auto; max-height:92vh; } }
  .lb-img-wrap{
    flex:1.3; background:var(--bg-soft);
    display:flex; align-items:center; justify-content:center;
    min-width:0;
  }
  .lb-img-wrap img{ width:100%; height:100%; object-fit:contain; max-height:90vh; }
  .lb-info{
    flex:1; padding:28px;
    display:flex; flex-direction:column;
    min-width:260px;
  }
  .lb-info h3{ font-size:19px; font-weight:700; margin:0 0 14px; letter-spacing:-0.01em; }
  .lb-info a.lb-link{
    font-size:13px; color:var(--accent); text-decoration:none;
    word-break:break-all;
    display:inline-flex; align-items:center; gap:5px;
    margin-bottom:24px;
  }
  .lb-info a.lb-link:hover{ text-decoration:underline; }
  .lb-info .lb-date{ font-size:12px; color:var(--ink-soft); margin-bottom:24px; }
  .lb-spacer{ flex:1; }
  .lb-delete{
    font-family:inherit;
    align-self:flex-start;
    background:none; border:1px solid var(--line);
    color:#B5473B;
    padding:9px 14px; border-radius:10px;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .lb-delete:hover{ background:#FBEBE9; border-color:#F0C9C4; }
  .lb-close{
    position:absolute; top:20px; right:24px;
    width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:none; font-size:18px;
  }
  .lb-close:hover{ background:rgba(255,255,255,0.28); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:#DED4BE; border-radius:10px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>Archive</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="header-actions">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="이름으로 검색" />
      </div>
      <button class="btn-add" id="openAdd">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        추가
      </button>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">아직 저장한 디자인이 없어요</div>
    <div class="small">우측 상단 '추가' 버튼으로 시작해보세요</div>
  </div>
</main>

<!-- Add Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>새 디자인 추가</h2>

    <div class="drop" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" multiple />
      <div class="drop-text"><b>클릭</b>하거나 이미지를 끌어다 놓으세요 (여러 장 가능)</div>
    </div>

    <div class="preview-grid" id="previewGrid"></div>

    <label class="field-label">이름</label>
    <input class="field" id="nameInput" placeholder="예: 미니멀 카드 UI" />

    <label class="field-label">링크 (선택)</label>
    <input class="field" id="linkInput" placeholder="https://..." />

    <div class="modal-actions">
      <button class="btn-cancel" id="cancelAdd">취소</button>
      <button class="btn-save" id="saveAdd" disabled>저장</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <div class="lb-inner">
    <div class="lb-img-wrap"><img id="lbImg" src="" /></div>
    <div class="lb-info">
      <h3 id="lbName"></h3>
      <a class="lb-link" id="lbLink" target="_blank" rel="noopener"></a>
      <div class="lb-date" id="lbDate"></div>
      <div class="lb-spacer"></div>
      <button class="lb-delete" id="lbDelete">삭제하기</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxVkV-o-DRmwOra8I0Bs7cboEx0VivjlQ",
  authDomain: "design-68ae0.firebaseapp.com",
  projectId: "design-68ae0",
  storageBucket: "design-68ae0.firebasestorage.app",
  messagingSenderId: "329664072087",
  appId: "1:329664072087:web:c3cf4782d738927ced5cd2",
  measurementId: "G-18Z0CRZQ68"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const designsCol = collection(db, "designs");

const CLOUDINARY_CLOUD = 'dbljkloal';
const CLOUDINARY_PRESET = 'Everything';

// ---------- State ----------
let allDesigns = [];
let pendingUploads = []; // {id, file, previewUrl, status, url}

// ---------- Elements ----------
const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const countEl = document.getElementById('count');
const searchInput = document.getElementById('searchInput');

const overlay = document.getElementById('overlay');
const openAddBtn = document.getElementById('openAdd');
const cancelAddBtn = document.getElementById('cancelAdd');
const saveAddBtn = document.getElementById('saveAdd');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const previewGrid = document.getElementById('previewGrid');
const nameInput = document.getElementById('nameInput');
const linkInput = document.getElementById('linkInput');

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbName = document.getElementById('lbName');
const lbLink = document.getElementById('lbLink');
const lbDate = document.getElementById('lbDate');
const lbClose = document.getElementById('lbClose');
const lbDelete = document.getElementById('lbDelete');

// ---------- Render grid ----------
function render(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = q
    ? allDesigns.filter(d => (d.name||'').toLowerCase().includes(q))
    : allDesigns;

  grid.innerHTML = '';
  emptyState.style.display = filtered.length === 0 ? 'flex' : 'none';
  countEl.textContent = allDesigns.length ? `${allDesigns.length}개` : '';

  filtered.forEach(d => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${d.imageUrl}" loading="lazy" />
      <div class="meta">
        <div class="name">${escapeHtml(d.name || '이름 없음')}</div>
        ${d.link ? `<div class="link-tag">🔗 링크 보기</div>` : ''}
      </div>
    `;
    card.addEventListener('click', () => openLightbox(d));
    grid.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Firestore live sync ----------
const q = query(designsCol, orderBy('createdAt', 'desc'));
onSnapshot(q, (snap) => {
  allDesigns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
});

searchInput.addEventListener('input', render);

// ---------- Lightbox ----------
let currentLightboxId = null;
function openLightbox(d){
  currentLightboxId = d.id;
  lbImg.src = d.imageUrl;
  lbName.textContent = d.name || '이름 없음';
  if (d.link){
    lbLink.style.display = 'inline-flex';
    lbLink.href = d.link;
    lbLink.textContent = d.link;
  } else {
    lbLink.style.display = 'none';
  }
  lbDate.textContent = d.createdAt?.toDate
    ? d.createdAt.toDate().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' })
    : '';
  lightbox.classList.add('open');
}
lbClose.addEventListener('click', () => lightbox.classList.remove('open'));
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });

lbDelete.addEventListener('click', async () => {
  if (!currentLightboxId) return;
  if (!confirm('이 디자인을 삭제할까요?')) return;
  await deleteDoc(doc(db, 'designs', currentLightboxId));
  lightbox.classList.remove('open');
});

// ---------- Add modal ----------
function openModal(){
  overlay.classList.add('open');
}
function closeModal(){
  overlay.classList.remove('open');
  pendingUploads = [];
  previewGrid.innerHTML = '';
  nameInput.value = '';
  linkInput.value = '';
  fileInput.value = '';
  updateSaveState();
}
openAddBtn.addEventListener('click', openModal);
cancelAddBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(fileList){
  Array.from(fileList).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const id = Math.random().toString(36).slice(2);
    const previewUrl = URL.createObjectURL(file);
    const item = { id, file, previewUrl, status: 'uploading', url: null };
    pendingUploads.push(item);
    renderPreview(item);
    uploadToCloudinary(item);
  });
}

function renderPreview(item){
  const el = document.createElement('div');
  el.className = 'preview-item';
  el.id = `preview-${item.id}`;
  el.innerHTML = `
    <img src="${item.previewUrl}" />
    <div class="status" id="status-${item.id}">
      <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><circle cx="12" cy="12" r="9" stroke-opacity="0.3"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>
    </div>
    <button class="remove" data-id="${item.id}">✕</button>
  `;
  el.querySelector('.remove').addEventListener('click', (e) => {
    e.stopPropagation();
    pendingUploads = pendingUploads.filter(p => p.id !== item.id);
    el.remove();
    updateSaveState();
  });
  previewGrid.appendChild(el);
}

async function uploadToCloudinary(item){
  try{
    const formData = new FormData();
    formData.append('file', item.file);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.secure_url){
      item.status = 'done';
      item.url = data.secure_url;
      const statusEl = document.getElementById(`status-${item.id}`);
      if (statusEl) statusEl.remove();
    } else {
      throw new Error('업로드 실패');
    }
  } catch(err){
    item.status = 'error';
    const statusEl = document.getElementById(`status-${item.id}`);
    if (statusEl) statusEl.innerHTML = `<span style="color:#fff;font-size:16px;">⚠️</span>`;
    console.error(err);
  }
  updateSaveState();
}

function updateSaveState(){
  const hasDone = pendingUploads.some(p => p.status === 'done');
  const stillUploading = pendingUploads.some(p => p.status === 'uploading');
  saveAddBtn.disabled = !hasDone || stillUploading;
  saveAddBtn.textContent = stillUploading ? '업로드 중...' : '저장';
}

saveAddBtn.addEventListener('click', async () => {
  const doneItems = pendingUploads.filter(p => p.status === 'done');
  if (doneItems.length === 0) return;
  saveAddBtn.disabled = true;
  saveAddBtn.textContent = '저장 중...';

  const name = nameInput.value.trim();
  const link = linkInput.value.trim();

  try {
    for (const item of doneItems){
      await addDoc(designsCol, {
        name: doneItems.length > 1 ? name : name,
        link: link || null,
        imageUrl: item.url,
        createdAt: serverTimestamp()
      });
    }
    closeModal();
  } catch(err){
    console.error(err);
    alert('저장 중 오류가 발생했어요.');
    saveAddBtn.disabled = false;
    saveAddBtn.textContent = '저장';
  }
});

// Esc to close
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    lightbox.classList.remove('open');
    if (overlay.classList.contains('open')) closeModal();
  }
});
</script>

</body>
</html>
