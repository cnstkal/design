<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg: #FBF8F2;
    --bg-soft: #F5F0E6;
    --card: #FFFFFF;
    --ink: #2B2823;
    --ink-soft: #8C8577;
    --line: #E9E2D4;
    --accent: #B8763E;
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(251,248,242,0.86);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1280px; margin:0 auto;
    padding:20px 28px;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand-mark{
    width:9px; height:9px; border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  .brand h1{
    font-size:17px; font-weight:700; letter-spacing:-0.01em; margin:0;
  }
  .brand .count{
    font-size:12.5px; color:var(--ink-soft); font-weight:500;
  }
  .header-actions{ display:flex; align-items:center; gap:10px; }

  .search{
    position:relative;
  }
  .search input{
    font-family:inherit;
    width:220px;
    padding:9px 14px 9px 32px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--bg-soft);
    font-size:13.5px;
    color:var(--ink);
    outline:none;
    transition:.15s ease;
  }
  .search input:focus{ border-color:var(--accent); background:#fff; width:260px; }
  .search svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; opacity:.5;
  }

  .cat-bar{ max-width:1280px; margin:0 auto; padding:14px 28px 0; display:flex; gap:8px; flex-wrap:wrap; }
  .cat-chip{ font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer; }
  .cat-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .card .cats{ margin-top:6px; display:flex; gap:4px; flex-wrap:wrap; }
  .card .cats span{ font-size:10px; font-weight:700; color:var(--accent); background:#F6ECE0; padding:2px 7px; border-radius:999px; }
  .tag-select{ display:flex; gap:6px; flex-wrap:wrap; }
  .tag-select .tag{ font-family:inherit; font-size:12px; font-weight:600; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink-soft); cursor:pointer; }
  .tag-select .tag.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .lb-cats{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:14px; }
  .lb-cats span{ font-size:11px; font-weight:700; color:var(--accent); background:#F6ECE0; padding:3px 9px; border-radius:999px; }

  .btn-add{
    font-family:inherit;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:10px 18px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:.15s ease;
  }
  .btn-add:hover{ background:var(--accent); transform:translateY(-1px); }

  /* ---------- Grid ---------- */
  main{
    max-width:1280px; margin:0 auto;
    padding:32px 28px 100px;
  }
  .grid{
    columns: 5 220px;
    column-gap:16px;
  }
  @media (max-width:1100px){ .grid{ columns: 3 200px; } }
  @media (max-width:640px){ .grid{ columns: 2 150px; column-gap:10px; padding:0; } main{padding:20px 14px 80px;} }

  .card{
    break-inside:avoid;
    margin-bottom:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    position:relative;
  }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: 0 14px 28px -12px rgba(43,40,35,0.18);
    border-color:#DED4BE;
  }
  .card img{
    width:100%; display:block;
    background:var(--bg-soft);
  }
  .card .meta{
    padding:11px 13px 13px;
  }
  .card .meta .name{
    font-size:13.5px; font-weight:600; letter-spacing:-0.01em;
    line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card .meta .link-tag{
    margin-top:5px;
    font-size:11px; color:var(--ink-soft);
    display:flex; align-items:center; gap:4px;
  }

  .empty{
    text-align:center;
    padding:120px 20px;
    color:var(--ink-soft);
  }
  .empty .big{ font-size:15px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .empty .small{ font-size:13px; }

  /* ---------- Modal (Add) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(43,40,35,0.35);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .overlay.open{ display:flex; }

  .modal{
    background:#fff;
    border-radius:20px;
    width:100%; max-width:420px;
    padding:26px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.3);
    max-height:88vh;
    overflow-y:auto;
  }
  .modal h2{
    font-size:16px; font-weight:700; margin:0 0 18px;
  }

  .drop{
    border:1.5px dashed var(--line);
    border-radius:14px;
    padding:22px;
    text-align:center;
    cursor:pointer;
    transition:.15s ease;
    position:relative;
    background:var(--bg-soft);
    margin-bottom:16px;
  }
  .drop.drag{ border-color:var(--accent); background:#F6ECE0; }
  .drop input[type=file]{ display:none; }
  .drop .drop-text{ font-size:13px; color:var(--ink-soft); }
  .drop .drop-text b{ color:var(--ink); }

  .preview-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:16px;
  }
  .preview-item{
    position:relative;
    aspect-ratio:1;
    border-radius:10px;
    overflow:hidden;
    background:var(--bg-soft);
    border:1px solid var(--line);
  }
  .preview-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-item .status{
    position:absolute; inset:0;
    background:rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .preview-item .status svg{ width:18px; height:18px; }
  .preview-item .remove{
    position:absolute; top:4px; right:4px;
    width:18px; height:18px; border-radius:50%;
    background:rgba(0,0,0,0.55); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; cursor:pointer; border:none;
    line-height:1;
  }
  .spin{ animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  label.field-label{
    display:block; font-size:12px; font-weight:600; color:var(--ink-soft);
    margin-bottom:6px; margin-top:14px;
  }
  .field-label:first-of-type{ margin-top:0; }
  input.field, textarea.field{
    font-family:inherit;
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
    background:#fff;
    transition:.15s ease;
  }
  input.field:focus{ border-color:var(--accent); }

  .modal-actions{
    display:flex; gap:8px; margin-top:22px;
  }
  .btn-cancel, .btn-save{
    font-family:inherit;
    flex:1;
    padding:11px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    border:none;
  }
  .btn-cancel{ background:var(--bg-soft); color:var(--ink); }
  .btn-cancel:hover{ background:var(--line); }
  .btn-save{ background:var(--ink); color:#fff; }
  .btn-save:hover{ background:var(--accent); }
  .btn-save:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- Lightbox (Detail) ---------- */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(20,18,15,0.82);
    display:none;
    align-items:center; justify-content:center;
    z-index:200;
    padding:30px;
  }
  .lightbox.open{ display:flex; }
  .lb-inner{
    background:#fff;
    border-radius:18px;
    max-width:900px; width:100%;
    max-height:90vh;
    display:flex;
    overflow:hidden;
  }
  @media (max-width:760px){ .lb-inner{ flex-direction:column; overflow-y:auto; max-height:92vh; } }
  .lb-img-wrap{
    flex:1.3; background:var(--bg-soft);
    display:flex; align-items:center; justify-content:center;
    min-width:0;
  }
  .lb-img-wrap img{ width:100%; height:100%; object-fit:contain; max-height:90vh; }
  .lb-info{
    flex:1; padding:28px;
    display:flex; flex-direction:column;
    min-width:260px;
  }
  .lb-info h3{ font-size:19px; font-weight:700; margin:0 0 14px; letter-spacing:-0.01em; }
  .lb-info a.lb-link{
    font-size:13px; color:var(--accent); text-decoration:none;
    word-break:break-all;
    display:inline-flex; align-items:center; gap:5px;
    margin-bottom:24px;
  }
  .lb-info a.lb-link:hover{ text-decoration:underline; }
  .lb-info .lb-date{ font-size:12px; color:var(--ink-soft); margin-bottom:24px; }
  .lb-spacer{ flex:1; }
  .lb-btn-row{ display:flex; gap:8px; }
  .lb-edit, .lb-delete{
    font-family:inherit;
    align-self:flex-start;
    background:none; border:1px solid var(--line);
    padding:9px 14px; border-radius:10px;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .lb-edit{ color:var(--ink); }
  .lb-edit:hover{ background:var(--bg-soft); }
  .lb-delete{ color:#B5473B; }
  .lb-delete:hover{ background:#FBEBE9; border-color:#F0C9C4; }
  .lb-close{
    position:absolute; top:20px; right:24px;
    width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:none; font-size:18px;
    z-index:5;
  }
  .lb-close:hover{ background:rgba(255,255,255,0.28); }

  /* Carousel */
  .lb-img-wrap{ position:relative; }
  .carousel-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:38px; height:38px; border-radius:50%;
    background:rgba(0,0,0,0.4);
    color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:18px; z-index:4;
    transition:.15s ease;
  }
  .carousel-arrow:hover{ background:rgba(0,0,0,0.6); }
  .carousel-arrow.prev{ left:14px; }
  .carousel-arrow.next{ right:14px; }
  .carousel-dots{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; z-index:4;
  }
  .carousel-dots .dot{
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,0.5);
    cursor:pointer;
  }
  .carousel-dots .dot.active{ background:#fff; }
  .carousel-count{
    position:absolute; top:14px; left:14px;
    background:rgba(0,0,0,0.4); color:#fff;
    font-size:11.5px; font-weight:600;
    padding:4px 10px; border-radius:999px;
    z-index:4;
  }

  /* Card carousel (grid) */
  .card .img-wrap{ position:relative; }
  .card .img-count{
    position:absolute; top:8px; right:8px;
    background:rgba(0,0,0,0.5); color:#fff;
    font-size:10.5px; font-weight:700;
    padding:3px 7px; border-radius:999px;
    display:flex; align-items:center; gap:3px;
  }

  /* Edit modal reuse */
  .thumb-strip{
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;
  }
  .thumb-item{
    position:relative; width:64px; height:64px; border-radius:8px;
    overflow:hidden; border:1px solid var(--line);
  }
  .thumb-item img{ width:100%; height:100%; object-fit:cover; }
  .thumb-item .remove{
    position:absolute; top:2px; right:2px;
    width:16px; height:16px; border-radius:50%;
    background:rgba(0,0,0,0.6); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; cursor:pointer; border:none; line-height:1;
  }
  .add-more-btn{
    width:64px; height:64px; border-radius:8px;
    border:1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft); font-size:20px;
    background:var(--bg-soft);
  }
  .add-more-btn:hover{ border-color:var(--accent); color:var(--accent); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:#DED4BE; border-radius:10px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>Archive</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="header-actions">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="이름으로 검색" />
      </div>
      <button class="btn-add" id="openAdd">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        추가
      </button>
    </div>
  </div>
</header>

<div class="cat-bar" id="catBar"></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">아직 저장한 디자인이 없어요</div>
    <div class="small">우측 상단 '추가' 버튼으로 시작해보세요</div>
  </div>
</main>

<!-- Add Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>새 디자인 추가</h2>

    <div class="drop" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" multiple />
      <div class="drop-text"><b>클릭</b>하거나 이미지를 끌어다 놓으세요 (여러 장 가능)</div>
    </div>

    <div class="preview-grid" id="previewGrid"></div>

    <label class="field-label">이름</label>
    <input class="field" id="nameInput" placeholder="예: 미니멀 카드 UI" />

    <label class="field-label">링크 (선택)</label>
    <input class="field" id="linkInput" placeholder="https://..." />

    <label class="field-label">Category</label>
    <div class="tag-select" id="catSelect"></div>

    <div class="modal-actions">
      <button class="btn-cancel" id="cancelAdd">취소</button>
      <button class="btn-save" id="saveAdd" disabled>저장</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <div class="lb-inner">
    <div class="lb-img-wrap" id="lbImgWrap">
      <span class="carousel-count" id="lbCount" style="display:none;"></span>
      <img id="lbImg" src="" />
      <button class="carousel-arrow prev" id="lbPrev" style="display:none;">‹</button>
      <button class="carousel-arrow next" id="lbNext" style="display:none;">›</button>
      <div class="carousel-dots" id="lbDots"></div>
    </div>
    <div class="lb-info">
      <h3 id="lbName"></h3>
      <a class="lb-link" id="lbLink" target="_blank" rel="noopener"></a>
      <div class="lb-date" id="lbDate"></div>
      <div class="lb-spacer"></div>
      <div class="lb-btn-row">
        <button class="lb-edit" id="lbEdit">수정하기</button>
        <button class="lb-delete" id="lbDelete">삭제하기</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2>디자인 수정</h2>

    <div class="thumb-strip" id="editThumbStrip"></div>

    <label class="field-label">이름</label>
    <input class="field" id="editNameInput" placeholder="예: 미니멀 카드 UI" />

    <label class="field-label">링크 (선택)</label>
    <input class="field" id="editLinkInput" placeholder="https://..." />

    <label class="field-label">Category</label>
    <div class="tag-select" id="editCatSelect"></div>

    <input type="file" id="editFileInput" accept="image/*" multiple style="display:none;" />

    <div class="modal-actions">
      <button class="btn-cancel" id="cancelEdit">취소</button>
      <button class="btn-save" id="saveEdit">저장</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxVkV-o-DRmwOra8I0Bs7cboEx0VivjlQ",
  authDomain: "design-68ae0.firebaseapp.com",
  projectId: "design-68ae0",
  storageBucket: "design-68ae0.firebasestorage.app",
  messagingSenderId: "329664072087",
  appId: "1:329664072087:web:c3cf4782d738927ced5cd2",
  measurementId: "G-18Z0CRZQ68"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const designsCol = collection(db, "designs");

const CLOUDINARY_CLOUD = 'dbljkloal';
const CLOUDINARY_PRESET = 'Everything';

const CATEGORIES = ['Design','Source','Font','Color','Mockup','Template','Tool'];
let activeCat = null;
let selectedCats = [];
let editSelectedCats = [];

// ---------- State ----------
let allDesigns = [];
let pendingUploads = []; // {id, file, previewUrl, status, url}
let lbImages = [];
let lbIndex = 0;
let editThumbs = []; // {url} existing, kept as array of urls
let editPendingUploads = []; // newly added files for edit
let editingId = null;

// ---------- Elements ----------
const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const countEl = document.getElementById('count');
const searchInput = document.getElementById('searchInput');
const catBar = document.getElementById('catBar');
const catSelect = document.getElementById('catSelect');
const editCatSelect = document.getElementById('editCatSelect');

function renderCatBar(){
  catBar.innerHTML = ['All', ...CATEGORIES].map(c =>
    `<button class="cat-chip ${((c==='All'&&!activeCat)||c===activeCat)?'active':''}" data-c="${c}">${c}</button>`
  ).join('');
  catBar.querySelectorAll('.cat-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.c === 'All' ? null : btn.dataset.c;
      renderCatBar();
      render();
    });
  });
}
renderCatBar();

function renderTagSelect(el, selectedArr){
  el.innerHTML = CATEGORIES.map(c => `<button type="button" class="tag ${selectedArr.includes(c)?'on':''}" data-c="${c}">${c}</button>`).join('');
  el.querySelectorAll('.tag').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = btn.dataset.c;
      const i = selectedArr.indexOf(c);
      if (i === -1) selectedArr.push(c); else selectedArr.splice(i, 1);
      renderTagSelect(el, selectedArr);
    });
  });
}

const overlay = document.getElementById('overlay');
const openAddBtn = document.getElementById('openAdd');
const cancelAddBtn = document.getElementById('cancelAdd');
const saveAddBtn = document.getElementById('saveAdd');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const previewGrid = document.getElementById('previewGrid');
const nameInput = document.getElementById('nameInput');
const linkInput = document.getElementById('linkInput');

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbName = document.getElementById('lbName');
const lbLink = document.getElementById('lbLink');
const lbDate = document.getElementById('lbDate');
const lbClose = document.getElementById('lbClose');
const lbDelete = document.getElementById('lbDelete');
const lbEdit = document.getElementById('lbEdit');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');
const lbDots = document.getElementById('lbDots');
const lbCount = document.getElementById('lbCount');

const editOverlay = document.getElementById('editOverlay');
const editThumbStrip = document.getElementById('editThumbStrip');
const editNameInput = document.getElementById('editNameInput');
const editLinkInput = document.getElementById('editLinkInput');
const editFileInput = document.getElementById('editFileInput');
const cancelEditBtn = document.getElementById('cancelEdit');
const saveEditBtn = document.getElementById('saveEdit');

// ---------- Render grid ----------
function render(){
  const q = searchInput.value.trim().toLowerCase();
  let filtered = q ? allDesigns.filter(d => (d.name||'').toLowerCase().includes(q)) : allDesigns;
  if (activeCat) filtered = filtered.filter(d => (d.categories||[]).includes(activeCat));

  grid.innerHTML = '';
  emptyState.style.display = filtered.length === 0 ? 'flex' : 'none';
  countEl.textContent = allDesigns.length ? `${allDesigns.length}개` : '';

  filtered.forEach(d => {
    const images = d.images && d.images.length ? d.images : (d.imageUrl ? [d.imageUrl] : []);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="img-wrap">
        <img src="${images[0] || ''}" loading="lazy" />
        ${images.length > 1 ? `<div class="img-count">🖼 ${images.length}</div>` : ''}
      </div>
      <div class="meta">
        <div class="name">${escapeHtml(d.name || '이름 없음')}</div>
        ${d.link ? `<div class="link-tag">🔗 링크 보기</div>` : ''}
        ${(d.categories&&d.categories.length) ? `<div class="cats">${d.categories.map(c=>`<span>${c}</span>`).join('')}</div>` : ''}
      </div>
    `;
    card.addEventListener('click', () => openLightbox(d));
    grid.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Firestore live sync ----------
const q = query(designsCol, orderBy('createdAt', 'desc'));
onSnapshot(q, (snap) => {
  allDesigns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
});

searchInput.addEventListener('input', render);

// ---------- Lightbox ----------
let currentLightboxId = null;
function openLightbox(d){
  currentLightboxId = d.id;
  lbImages = d.images && d.images.length ? d.images : (d.imageUrl ? [d.imageUrl] : []);
  lbIndex = 0;
  renderLbImage();

  lbName.textContent = d.name || '이름 없음';
  let catsEl = document.getElementById('lbCats');
  if (!catsEl){ catsEl = document.createElement('div'); catsEl.id='lbCats'; catsEl.className='lb-cats'; lbName.after(catsEl); }
  catsEl.innerHTML = (d.categories||[]).map(c=>`<span>${c}</span>`).join('');
  if (d.link){
    lbLink.style.display = 'inline-flex';
    lbLink.href = d.link;
    lbLink.textContent = d.link;
  } else {
    lbLink.style.display = 'none';
  }
  lbDate.textContent = d.createdAt?.toDate
    ? d.createdAt.toDate().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' })
    : '';
  lightbox.classList.add('open');
}

function renderLbImage(){
  lbImg.src = lbImages[lbIndex];
  const multi = lbImages.length > 1;
  lbPrev.style.display = multi ? 'flex' : 'none';
  lbNext.style.display = multi ? 'flex' : 'none';
  lbCount.style.display = multi ? 'block' : 'none';
  lbCount.textContent = `${lbIndex + 1} / ${lbImages.length}`;
  lbDots.innerHTML = '';
  if (multi){
    lbImages.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === lbIndex ? ' active' : '');
      dot.addEventListener('click', () => { lbIndex = i; renderLbImage(); });
      lbDots.appendChild(dot);
    });
  }
}
lbPrev.addEventListener('click', () => { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; renderLbImage(); });
lbNext.addEventListener('click', () => { lbIndex = (lbIndex + 1) % lbImages.length; renderLbImage(); });

lbClose.addEventListener('click', () => lightbox.classList.remove('open'));
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });

lbDelete.addEventListener('click', async () => {
  if (!currentLightboxId) return;
  if (!confirm('이 디자인을 삭제할까요? 사진 전체가 삭제됩니다.')) return;
  await deleteDoc(doc(db, 'designs', currentLightboxId));
  lightbox.classList.remove('open');
});

document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') lbPrev.click();
  if (e.key === 'ArrowRight') lbNext.click();
});

// ---------- Edit modal ----------
lbEdit.addEventListener('click', () => {
  const d = allDesigns.find(x => x.id === currentLightboxId);
  if (!d) return;
  editingId = d.id;
  editThumbs = d.images && d.images.length ? [...d.images] : (d.imageUrl ? [d.imageUrl] : []);
  editPendingUploads = [];
  editNameInput.value = d.name || '';
  editLinkInput.value = d.link || '';
  editSelectedCats = [...(d.categories||[])];
  renderTagSelect(editCatSelect, editSelectedCats);
  renderEditThumbs();
  lightbox.classList.remove('open');
  editOverlay.classList.add('open');
});

function renderEditThumbs(){
  editThumbStrip.innerHTML = '';
  editThumbs.forEach((url, i) => {
    const el = document.createElement('div');
    el.className = 'thumb-item';
    el.innerHTML = `<img src="${url}" /><button class="remove" data-i="${i}">✕</button>`;
    el.querySelector('.remove').addEventListener('click', () => {
      editThumbs.splice(i, 1);
      renderEditThumbs();
    });
    editThumbStrip.appendChild(el);
  });
  editPendingUploads.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'thumb-item';
    el.innerHTML = `<img src="${item.previewUrl}" /><button class="remove" data-i="${i}">✕</button>`;
    if (item.status === 'uploading'){
      el.innerHTML += `<div class="status" style="position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;"><svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><circle cx="12" cy="12" r="9" stroke-opacity="0.3"/><path d="M21 12a9 9 0 0 0-9-9"/></svg></div>`;
    }
    el.querySelector('.remove').addEventListener('click', () => {
      editPendingUploads.splice(i, 1);
      renderEditThumbs();
    });
    editThumbStrip.appendChild(el);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'add-more-btn';
  addBtn.textContent = '+';
  addBtn.addEventListener('click', () => editFileInput.click());
  editThumbStrip.appendChild(addBtn);
}

editFileInput.addEventListener('change', (e) => {
  Array.from(e.target.files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const item = { file, previewUrl: URL.createObjectURL(file), status: 'uploading', url: null };
    editPendingUploads.push(item);
    uploadToCloudinaryGeneric(item, renderEditThumbs);
  });
  renderEditThumbs();
  editFileInput.value = '';
});

async function uploadToCloudinaryGeneric(item, onUpdate){
  try{
    const formData = new FormData();
    formData.append('file', item.file);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, { method:'POST', body:formData });
    const data = await res.json();
    if (data.secure_url){
      item.status = 'done';
      item.url = data.secure_url;
    } else {
      throw new Error('업로드 실패');
    }
  } catch(err){
    item.status = 'error';
    console.error(err);
  }
  onUpdate();
}

cancelEditBtn.addEventListener('click', () => {
  editOverlay.classList.remove('open');
  editingId = null;
});
editOverlay.addEventListener('click', (e) => { if (e.target === editOverlay){ editOverlay.classList.remove('open'); editingId = null; } });

saveEditBtn.addEventListener('click', async () => {
  if (!editingId) return;
  const stillUploading = editPendingUploads.some(p => p.status === 'uploading');
  if (stillUploading){ alert('이미지 업로드가 끝날 때까지 기다려주세요.'); return; }

  const newUrls = editPendingUploads.filter(p => p.status === 'done').map(p => p.url);
  const finalImages = [...editThumbs, ...newUrls];
  if (finalImages.length === 0){ alert('최소 1장의 이미지가 필요해요.'); return; }

  saveEditBtn.disabled = true;
  saveEditBtn.textContent = '저장 중...';
  try{
    await updateDoc(doc(db, 'designs', editingId), {
      name: editNameInput.value.trim(),
      link: editLinkInput.value.trim() || null,
      images: finalImages,
      imageUrl: finalImages[0],
      categories: editSelectedCats
    });
    editOverlay.classList.remove('open');
  } catch(err){
    console.error(err);
    alert('수정 중 오류가 발생했어요.');
  } finally {
    saveEditBtn.disabled = false;
    saveEditBtn.textContent = '저장';
    editingId = null;
  }
});

// ---------- Add modal ----------
function openModal(){
  selectedCats = [];
  renderTagSelect(catSelect, selectedCats);
  overlay.classList.add('open');
}
function closeModal(){
  overlay.classList.remove('open');
  pendingUploads = [];
  previewGrid.innerHTML = '';
  nameInput.value = '';
  linkInput.value = '';
  fileInput.value = '';
  selectedCats = [];
  updateSaveState();
}
openAddBtn.addEventListener('click', openModal);
cancelAddBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(fileList){
  Array.from(fileList).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const id = Math.random().toString(36).slice(2);
    const previewUrl = URL.createObjectURL(file);
    const item = { id, file, previewUrl, status: 'uploading', url: null };
    pendingUploads.push(item);
    renderPreview(item);
    uploadToCloudinary(item);
  });
}

function renderPreview(item){
  const el = document.createElement('div');
  el.className = 'preview-item';
  el.id = `preview-${item.id}`;
  el.innerHTML = `
    <img src="${item.previewUrl}" />
    <div class="status" id="status-${item.id}">
      <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><circle cx="12" cy="12" r="9" stroke-opacity="0.3"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>
    </div>
    <button class="remove" data-id="${item.id}">✕</button>
  `;
  el.querySelector('.remove').addEventListener('click', (e) => {
    e.stopPropagation();
    pendingUploads = pendingUploads.filter(p => p.id !== item.id);
    el.remove();
    updateSaveState();
  });
  previewGrid.appendChild(el);
}

async function uploadToCloudinary(item){
  try{
    const formData = new FormData();
    formData.append('file', item.file);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.secure_url){
      item.status = 'done';
      item.url = data.secure_url;
      const statusEl = document.getElementById(`status-${item.id}`);
      if (statusEl) statusEl.remove();
    } else {
      throw new Error('업로드 실패');
    }
  } catch(err){
    item.status = 'error';
    const statusEl = document.getElementById(`status-${item.id}`);
    if (statusEl) statusEl.innerHTML = `<span style="color:#fff;font-size:16px;">⚠️</span>`;
    console.error(err);
  }
  updateSaveState();
}

function updateSaveState(){
  const hasDone = pendingUploads.some(p => p.status === 'done');
  const stillUploading = pendingUploads.some(p => p.status === 'uploading');
  saveAddBtn.disabled = !hasDone || stillUploading;
  saveAddBtn.textContent = stillUploading ? '업로드 중...' : '저장';
}

saveAddBtn.addEventListener('click', async () => {
  const doneItems = pendingUploads.filter(p => p.status === 'done');
  if (doneItems.length === 0) return;
  saveAddBtn.disabled = true;
  saveAddBtn.textContent = '저장 중...';

  const name = nameInput.value.trim();
  const link = linkInput.value.trim();
  const images = doneItems.map(item => item.url);

  try {
    await addDoc(designsCol, {
      name: name,
      link: link || null,
      images: images,
      imageUrl: images[0],
      categories: selectedCats,
      createdAt: serverTimestamp()
    });
    closeModal();
  } catch(err){
    console.error(err);
    alert('저장 중 오류가 발생했어요.');
    saveAddBtn.disabled = false;
    saveAddBtn.textContent = '저장';
  }
});

// Esc to close
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    lightbox.classList.remove('open');
    if (overlay.classList.contains('open')) closeModal();
    if (editOverlay.classList.contains('open')){ editOverlay.classList.remove('open'); editingId = null; }
  }
});
</script>
