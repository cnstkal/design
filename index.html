<style>
  :root{--bg:#FBF8F2;--bg-soft:#F5F0E6;--card:#FFFFFF;--ink:#2B2823;--ink-soft:#8C8577;--line:#E9E2D4;--accent:#B8763E;--radius:14px;}

  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#DED4BE;border-radius:10px}
</style>

<header><div class="header-inner"><div class="header-actions"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" placeholder="이름으로 검색" /></div><button class="btn-add" id="openAdd"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>추가</span></button></div></div></header>
<div class="cat-bar" id="catBar"></div>
<main><div class="grid" id="grid"></div><div class="empty" id="emptyState" style="display:none;"><div class="big">아직 저장한 디자인이 없어요</div><div class="small">우측 상단 '추가' 버튼으로 시작해보세요</div></div></main>

<div class="overlay" id="overlay"><div class="modal"><h2>새 디자인 추가</h2><div class="drop" id="dropZone"><input type="file" id="fileInput" accept="image/*" multiple /><div class="drop-text"><b>클릭</b>하거나 이미지를 끌어다 놓으세요 (여러 장 가능)</div></div><div class="preview-grid" id="previewGrid"></div><label class="field-label">이름</label><input class="field" id="nameInput" placeholder="예: 미니멀 카드 UI" /><label class="field-label">링크 (선택)</label><input class="field" id="linkInput" placeholder="https://..." /><label class="field-label">Category</label><div class="tag-select" id="catSelect"></div><div id="subLabel" class="sub-label" style="display:none;"></div><div class="tag-select" id="subSelect" style="margin-top:0;"></div><div id="addError" class="error-note"></div><div class="modal-actions"><button class="btn-cancel" id="cancelAdd">취소</button><button class="btn-save" id="saveAdd" disabled>저장</button></div></div></div>

<div class="lightbox" id="lightbox"><button class="lb-close" id="lbClose">✕</button><div class="lb-inner"><div class="lb-img-wrap" id="lbImgWrap"><span class="carousel-count" id="lbCount" style="display:none;"></span><img id="lbImg" src="" alt="" /><button class="carousel-arrow prev" id="lbPrev" style="display:none;">‹</button><button class="carousel-arrow next" id="lbNext" style="display:none;">›</button><div class="carousel-dots" id="lbDots"></div></div><div class="lb-info"><h3 id="lbName"></h3><div id="lbCats" class="lb-cats"></div><a class="lb-link-btn" id="lbLink" target="_blank" rel="noopener noreferrer">Open Link ↗</a><div class="lb-date" id="lbDate" style="display:none;"></div><div class="lb-spacer"></div><div class="lb-btn-row"><button class="lb-edit" id="lbEdit">수정하기</button><button class="lb-delete" id="lbDelete">삭제하기</button></div></div></div></div>

<div class="overlay" id="editOverlay"><div class="modal"><h2>디자인 수정</h2><div class="thumb-strip" id="editThumbStrip"></div><label class="field-label">이름</label><input class="field" id="editNameInput" placeholder="예: 미니멀 카드 UI" /><label class="field-label">링크 (선택)</label><input class="field" id="editLinkInput" placeholder="https://..." /><label class="field-label">Category</label><div class="tag-select" id="editCatSelect"></div><div id="editSubLabel" class="sub-label" style="display:none;"></div><div class="tag-select" id="editSubSelect" style="margin-top:0;"></div><div id="editError" class="error-note"></div><input type="file" id="editFileInput" accept="image/*" multiple style="display:none;" /><div class="modal-actions"><button class="btn-cancel" id="cancelEdit">취소</button><button class="btn-save" id="saveEdit">저장</button></div></div></div>

<script type="module">

function escapeHtml(str){const div=document.createElement('div');div.textContent=String(str??'');return div.innerHTML;}
function safeUrl(raw){try{const u=new URL(String(raw));return /^https?:$/.test(u.protocol)?u.href:'';}catch{return '';}}

function revokePreview(url){if(url&&url.startsWith('blob:'))URL.revokeObjectURL(url);}

function renderCatBar(){catBar.innerHTML=['All',...CATEGORIES].map(c=>`<button class="cat-chip ${((c==='All'&&!activeCat)||c===activeCat)?'active':''}" data-c="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');catBar.querySelectorAll('.cat-chip').forEach(btn=>btn.addEventListener('click',()=>{activeCat=btn.dataset.c==='All'?null:btn.dataset.c;renderCatBar();render();}));}

function renderSubSelect(el,cats,subArr,labelEl){const isEffect=cats.includes('Effect'),isTip=cats.includes('Tip');const opts=isEffect?EFFECT_TOOLS:cats.includes('Font')?FONT_LANGS:isTip?TIP_OPTIONS:[];el.innerHTML='';el.style.display=opts.length?'flex':'none';if(labelEl){labelEl.style.display=opts.length?'block':'none';labelEl.textContent=isEffect?'Effect Tool':isTip?'Tip Type':'Font Language';}opts.forEach(opt=>{const btn=document.createElement('button');btn.type='button';btn.className='tag'+(subArr.includes(opt)?' on':'');if(subArr.includes(opt))btn.style.background='#555';btn.textContent=opt;btn.addEventListener('click',()=>{const i=subArr.indexOf(opt);if(i===-1)subArr.push(opt);else subArr.splice(i,1);renderSubSelect(el,cats,subArr,labelEl);});el.appendChild(btn);});}

function fallbackImg(name){return svgDataUrl(name||'Link');}
function normalizeDesign(raw,id){const categories=Array.isArray(raw.categories)?raw.categories.filter(Boolean):[];const subTags=Array.isArray(raw.subTags)?raw.subTags.filter(Boolean):[];const images=Array.isArray(raw.images)?raw.images.filter(Boolean):(raw.imageUrl?[raw.imageUrl]:[]);return {id,name:String(raw.name??''),link:safeUrl(raw.link||''),categories,subTags,images,imageUrl:images[0]||'',createdAt:raw.createdAt||null};}
function buildCard(d){const card=document.createElement('div');card.className='card';const images=d.images;const wrap=document.createElement('div');wrap.className='img-wrap';const img=document.createElement('img');img.loading='lazy';img.decoding='async';img.alt=d.name||'디자인';img.src=images[0]||fallbackImg(d.name);img.addEventListener('error',()=>{if(img.dataset.fallback)return;img.dataset.fallback='1';img.src=fallbackImg(d.name);});wrap.appendChild(img);if(images.length>1){const count=document.createElement('div');count.className='img-count';count.textContent=`▧ ${images.length}`;wrap.appendChild(count);}card.appendChild(wrap);const meta=document.createElement('div');meta.className='meta';const name=document.createElement('div');name.className='name';name.textContent=d.name||'이름 없음';meta.appendChild(name);if(d.categories.length){const cats=document.createElement('div');cats.className='cats';[...d.categories,...d.subTags].forEach(c=>{const s=document.createElement('span');const color=CAT_COLORS[c]||'#666';s.textContent=c;s.style.background=(CAT_COLORS[c]?color:' #eee')+'20';s.style.color=color;cats.appendChild(s);});meta.appendChild(cats);}card.appendChild(meta);card.addEventListener('click',()=>openLightbox(d));return card;}
function render(){const q=searchInput.value.trim().toLowerCase();let filtered=q?allDesigns.filter(d=>d.name.toLowerCase().includes(q)):allDesigns;if(activeCat)filtered=filtered.filter(d=>d.categories.includes(activeCat));grid.innerHTML='';emptyState.style.display=filtered.length===0?'block':'none';if(filtered.length===0){return;}const numCols=getColCount();const cols=[];for(let i=0;i<numCols;i++){const col=document.createElement('div');col.className='grid-col';cols.push(col);grid.appendChild(col);}filtered.forEach((d,i)=>cols[i%numCols].appendChild(buildCard(d)));}
let resizeColCount=getColCount();window.addEventListener('resize',()=>{const c=getColCount();if(c!==resizeColCount){resizeColCount=c;render();}});
renderCatBar();

async function loadDesignsSnapshot(){
  if(unsubscribe)unsubscribe();
  try{const q=query(designsCol,orderBy('createdAt','desc'));unsubscribe=onSnapshot(q,snap=>{allDesigns=snap.docs.map(d=>normalizeDesign(d.data(),d.id));render();},err=>{console.error(err);setError(addError,'Firebase 데이터를 불러오지 못했어요. 네트워크나 권한을 확인해주세요.');});}
  catch(err){console.error(err);try{const snap=await getDocs(designsCol);allDesigns=snap.docs.map(d=>normalizeDesign(d.data(),d.id));allDesigns.sort((a,b)=>{const at=a.createdAt?.toMillis?a.createdAt.toMillis():0;const bt=b.createdAt?.toMillis?b.createdAt.toMillis():0;return bt-at;});render();}catch(e){console.error(e);setError(addError,'데이터를 불러오지 못했어요.');}}
}
loadDesignsSnapshot();searchInput.addEventListener('input',render);

function openLightbox(d){currentLightboxId=d.id;lbImages=d.images.length?d.images:[d.imageUrl].filter(Boolean);lbIndex=0;lbName.textContent=d.name||'이름 없음';lbCats.innerHTML='';[...d.categories,...d.subTags].forEach(c=>{const s=document.createElement('span');s.textContent=c;s.style.background=CAT_COLORS[c]||'#999';lbCats.appendChild(s);});const validLink=safeUrl(d.link);if(validLink){lbLink.style.display='inline-flex';lbLink.href=validLink;}else lbLink.style.display='none';if(d.createdAt?.toDate){lbDate.style.display='block';lbDate.textContent=d.createdAt.toDate().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});}else{lbDate.style.display='none';lbDate.textContent='';}renderLbImage();lightbox.classList.add('open');}
function renderLbImage(){const src=lbImages[lbIndex]||fallbackImg(lbName.textContent);lbImg.onerror=()=>{lbImg.onerror=null;lbImg.src=fallbackImg(lbName.textContent);};lbImg.src=src;const multi=lbImages.length>1;lbPrev.style.display=multi?'flex':'none';lbNext.style.display=multi?'flex':'none';lbCount.style.display=multi?'block':'none';lbCount.textContent=multi?`${lbIndex+1} / ${lbImages.length}`:'';lbDots.innerHTML='';if(multi)lbImages.forEach((_,i)=>{const dot=document.createElement('div');dot.className='dot'+(i===lbIndex?' active':'');dot.addEventListener('click',ev=>{ev.stopPropagation();lbIndex=i;renderLbImage();});lbDots.appendChild(dot);});}
lbPrev.addEventListener('click',e=>{e.stopPropagation();lbIndex=(lbIndex-1+lbImages.length)%lbImages.length;renderLbImage();});lbNext.addEventListener('click',e=>{e.stopPropagation();lbIndex=(lbIndex+1)%lbImages.length;renderLbImage();});lbClose.addEventListener('click',()=>lightbox.classList.remove('open'));lightbox.addEventListener('click',e=>{if(e.target===lightbox)lightbox.classList.remove('open');});

async function deleteCurrent(){if(!currentLightboxId)return;if(saveBusy)return;if(!confirm('이 디자인을 삭제할까요? 사진 전체가 삭제됩니다.'))return;saveBusy=true;lbDelete.disabled=true;const id=currentLightboxId;try{await deleteDoc(doc(db,'designs',id));lightbox.classList.remove('open');currentLightboxId=null;}catch(err){console.error(err);alert('삭제 중 오류가 발생했어요.');}finally{saveBusy=false;lbDelete.disabled=false;}}
lbDelete.addEventListener('click',deleteCurrent);
document.addEventListener('keydown',e=>{if(lightbox.classList.contains('open')){if(e.key==='ArrowLeft')lbPrev.click();if(e.key==='ArrowRight')lbNext.click();if(e.key==='Escape')lightbox.classList.remove('open');}});

lbEdit.addEventListener('click',()=>{const d=allDesigns.find(x=>x.id===currentLightboxId);if(!d)return;editingId=d.id;editThumbs=[...d.images];editPendingUploads=[];editNameInput.value=d.name;editLinkInput.value=d.link||'';editSelectedCats=[...d.categories];editSelectedSub=[...d.subTags];renderTagSelect(editCatSelect,editSelectedCats,()=>renderSubSelect(editSubSelect,editSelectedCats,editSelectedSub,editSubLabel));renderSubSelect(editSubSelect,editSelectedCats,editSelectedSub,editSubLabel);setError(editError,'');renderEditThumbs();lightbox.classList.remove('open');editOverlay.classList.add('open');});
function renderEditThumbs(){editThumbStrip.innerHTML='';editThumbs.forEach((url,i)=>{const el=document.createElement('div');el.className='thumb-item';const im=document.createElement('img');im.src=url;im.loading='lazy';im.onerror=()=>{im.src=fallbackImg('Image');};const b=document.createElement('button');b.className='remove';b.textContent='✕';b.addEventListener('click',()=>{editThumbs.splice(i,1);renderEditThumbs();});el.append(im,b);editThumbStrip.appendChild(el);});editPendingUploads.forEach((item,i)=>{const el=document.createElement('div');el.className='thumb-item';const im=document.createElement('img');im.src=item.previewUrl;const b=document.createElement('button');b.className='remove';b.textContent='✕';b.addEventListener('click',()=>{revokePreview(item.previewUrl);editPendingUploads.splice(i,1);renderEditThumbs();});el.append(im,b);if(item.status==='uploading'){const s=document.createElement('div');s.className='status';s.innerHTML='<span style="color:#fff">…</span>';el.appendChild(s);}else if(item.status==='error'){const s=document.createElement('div');s.className='status';s.innerHTML='<span style="color:#fff;font-size:16px">⚠️</span>';el.appendChild(s);}editThumbStrip.appendChild(el);});const addBtn=document.createElement('div');addBtn.className='add-more-btn';addBtn.textContent='+';addBtn.addEventListener('click',()=>editFileInput.click());editThumbStrip.appendChild(addBtn);}
editFileInput.addEventListener('change',e=>{handleEditFiles(e.target.files);editFileInput.value='';});
function handleEditFiles(fileList){Array.from(fileList||[]).forEach(file=>{if(!file.type.startsWith('image/'))return;const item={file,previewUrl:URL.createObjectURL(file),status:'uploading',url:null};editPendingUploads.push(item);uploadToCloudinaryGeneric(item,renderEditThumbs);});renderEditThumbs();}
async function uploadToCloudinaryGeneric(item,onUpdate){try{const fd=new FormData();fd.append('file',item.file);fd.append('upload_preset',CLOUDINARY_PRESET);const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd,signal:controller.signal});clearTimeout(timer);const data=await res.json();if(!res.ok||!data.secure_url)throw new Error(data.error?.message||'업로드 실패');item.status='done';item.url=data.secure_url;}catch(err){console.error(err);item.status='error';}finally{onUpdate();}}
cancelEditBtn.addEventListener('click',()=>{editPendingUploads.forEach(p=>revokePreview(p.previewUrl));editOverlay.classList.remove('open');editingId=null;});editOverlay.addEventListener('click',e=>{if(e.target===editOverlay)cancelEditBtn.click();});
saveEditBtn.addEventListener('click',async()=>{if(!editingId||editSaveBusy)return;const uploading=editPendingUploads.some(p=>p.status==='uploading');const errors=editPendingUploads.some(p=>p.status==='error');if(uploading){setError(editError,'이미지 업로드가 끝날 때까지 기다려주세요.');return;}if(errors){setError(editError,'업로드에 실패한 이미지가 있어요. 실패한 이미지를 삭제한 뒤 다시 저장해주세요.');return;}const newUrls=editPendingUploads.filter(p=>p.status==='done').map(p=>p.url);const finalImages=[...editThumbs,...newUrls].filter(Boolean);const name=editNameInput.value.trim();if(finalImages.length===0){setError(editError,'최소 1장의 이미지가 필요해요.');return;}if(!name){setError(editError,'이름을 입력해주세요.');return;}editSaveBusy=true;saveEditBtn.disabled=true;saveEditBtn.textContent='저장 중...';setError(editError,'');try{await updateDoc(doc(db,'designs',editingId),{name,link:safeUrl(editLinkInput.value.trim())||null,images:finalImages,imageUrl:finalImages[0],categories:[...editSelectedCats],subTags:[...editSelectedSub]});editPendingUploads.forEach(p=>revokePreview(p.previewUrl));editOverlay.classList.remove('open');editingId=null;}catch(err){console.error(err);setError(editError,'수정 중 오류가 발생했어요.');}finally{editSaveBusy=false;saveEditBtn.disabled=false;saveEditBtn.textContent='저장';}});

function openModal(){selectedCats=[];selectedSub=[];pendingUploads.forEach(p=>revokePreview(p.previewUrl));pendingUploads=[];renderTagSelect(catSelect,selectedCats,()=>renderSubSelect(subSelect,selectedCats,selectedSub,subLabel));renderSubSelect(subSelect,selectedCats,selectedSub,subLabel);setError(addError,'');overlay.classList.add('open');updateSaveState();}
function closeModal(){pendingUploads.forEach(p=>revokePreview(p.previewUrl));pendingUploads=[];overlay.classList.remove('open');previewGrid.innerHTML='';nameInput.value='';linkInput.value='';fileInput.value='';selectedCats=[];selectedSub=[];setError(addError,'');updateSaveState();}
openAddBtn.addEventListener('click',openModal);cancelAddBtn.addEventListener('click',closeModal);overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});dropZone.addEventListener('click',()=>fileInput.click());dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag');});dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag'));dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag');if(e.dataTransfer.files.length){handleFiles(e.dataTransfer.files);return;}const url=e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain');if(url&&/^https?:\/\//.test(url)){fetch(url,{mode:'cors'}).then(r=>{if(!r.ok)throw new Error('fetch failed');return r.blob();}).then(blob=>handleFiles([new File([blob],'image',{type:blob.type||'image/jpeg'})])).catch(()=>setError(addError,'외부 이미지는 보안 정책 때문에 바로 가져오지 못했어요. 이미지를 저장한 뒤 업로드해주세요.'));}});fileInput.addEventListener('change',e=>{handleFiles(e.target.files);fileInput.value='';});
document.addEventListener('paste',e=>{const items=e.clipboardData?.items;if(!items)return;const files=[];for(const it of items)if(it.type.startsWith('image/'))files.push(it.getAsFile());if(!files.length)return;if(overlay.classList.contains('open')){e.preventDefault();handleFiles(files);}else if(editOverlay.classList.contains('open')){e.preventDefault();handleEditFiles(files);}});
function handleFiles(fileList){for(const file of Array.from(fileList||[])){if(!file?.type?.startsWith('image/'))continue;if(file.size>15*1024*1024){setError(addError,'15MB보다 큰 이미지는 업로드할 수 없어요.');continue;}const id=Math.random().toString(36).slice(2);const previewUrl=URL.createObjectURL(file);const item={id,file,previewUrl,status:'uploading',url:null};pendingUploads.push(item);renderPreview(item);uploadToCloudinary(item);}}
function renderPreview(item){const el=document.createElement('div');el.className='preview-item';el.id=`preview-${item.id}`;const img=document.createElement('img');img.src=item.previewUrl;img.alt='업로드 미리보기';const status=document.createElement('div');status.className='status';status.id=`status-${item.id}`;status.innerHTML='<span class="spin" style="color:#fff">◌</span>';const rm=document.createElement('button');rm.className='remove';rm.textContent='✕';rm.addEventListener('click',e=>{e.stopPropagation();const found=pendingUploads.find(p=>p.id===item.id);if(found)revokePreview(found.previewUrl);pendingUploads=pendingUploads.filter(p=>p.id!==item.id);el.remove();updateSaveState();});el.append(img,status,rm);previewGrid.appendChild(el);}
async function uploadToCloudinary(item){try{const fd=new FormData();fd.append('file',item.file);fd.append('upload_preset',CLOUDINARY_PRESET);const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd,signal:controller.signal});clearTimeout(timer);const data=await res.json();if(!res.ok||!data.secure_url)throw new Error(data.error?.message||'업로드 실패');item.status='done';item.url=data.secure_url;const statusEl=document.getElementById(`status-${item.id}`);if(statusEl)statusEl.remove();}catch(err){console.error(err);item.status='error';const statusEl=document.getElementById(`status-${item.id}`);if(statusEl)statusEl.innerHTML='<span style="color:#fff;font-size:16px">⚠️</span>';}updateSaveState();}
function updateSaveState(){const hasDone=pendingUploads.some(p=>p.status==='done'),stillUploading=pendingUploads.some(p=>p.status==='uploading');const hasLink=safeUrl(linkInput.value.trim());saveAddBtn.disabled=saveBusy||stillUploading||(!hasDone&&!hasLink);saveAddBtn.textContent=stillUploading?'업로드 중...':saveBusy?'저장 중...':'저장';}
linkInput.addEventListener('input',updateSaveState);
async function fetchLinkThumbnail(url){try{const valid=safeUrl(url);if(!valid)return null;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);const res=await fetch(`https://noembed.com/embed?url=${encodeURIComponent(valid)}`,{signal:controller.signal});clearTimeout(timer);if(!res.ok)return null;const data=await res.json();if(data.thumbnail_url)return `https://images.weserv.nl/?url=${encodeURIComponent(data.thumbnail_url.replace(/^https?:\/\//,''))}`;}catch(e){}try{return svgDataUrl(new URL(url).hostname.replace('www.',''));}catch{return svgDataUrl('Link');}}
saveAddBtn.addEventListener('click',async()=>{if(saveBusy)return;const doneItems=pendingUploads.filter(p=>p.status==='done');const failed=pendingUploads.some(p=>p.status==='error');const name=nameInput.value.trim();const link=safeUrl(linkInput.value.trim());if(failed){setError(addError,'업로드에 실패한 이미지가 있어요. 실패한 이미지를 삭제한 뒤 저장해주세요.');return;}if(!doneItems.length&&!link)return;if(!name){setError(addError,'이름을 입력해주세요.');return;}saveBusy=true;updateSaveState();setError(addError,'');try{let images=doneItems.map(x=>x.url).filter(Boolean);if(!images.length&&link){const thumb=await fetchLinkThumbnail(link);if(thumb)images=[thumb];}if(!images.length)throw new Error('이미지가 없습니다.');await addDoc(designsCol,{name,link:link||null,images,imageUrl:images[0],categories:[...selectedCats],subTags:[...selectedSub],createdAt:serverTimestamp()});closeModal();}catch(err){console.error(err);setError(addError,'저장 중 오류가 발생했어요.');}finally{saveBusy=false;updateSaveState();}});

document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(lightbox.classList.contains('open'))lightbox.classList.remove('open');if(overlay.classList.contains('open'))closeModal();if(editOverlay.classList.contains('open'))cancelEditBtn.click();});
</script>
